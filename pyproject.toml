[project]
name = "agentic-ms"
version = "0.1.0"
description = "Auto-generate MCP connectors from German municipal web forms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastapi-inertia>=1.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "cryptography>=43.0",
    "openai>=1.50",
    "anthropic>=0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]
explorer = [
    "playwright>=1.49",
    "anthropic>=0.42",
]
mcp = [
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "explorer/tests", "executor/tests", "mcp_server/tests"]

[tool.setuptools.packages.find]
include = ["backend*", "explorer*", "executor*", "mcp_server*"]
